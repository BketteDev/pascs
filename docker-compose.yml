# Portainer stack: Stacks > Add stack > Repository (docker-compose.yml).
# Game assets are directly built into the container image.
services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-6767}:6767"
    environment:
      MAP: ${MAP:-de_dust2}
      TEAM_SIZE: ${TEAM_SIZE:-5}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
